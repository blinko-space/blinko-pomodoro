<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blinko Pomodoro</title>
  <style>
    *{box-sizing:border-box}:root{color-scheme:light;--bg:rgba(255,255,255,.95);--surface:#f2f2f5;--text:#222329;--desc:#858791;--line:rgba(30,31,36,.09);--accent:#ed625e;--accent-soft:rgba(237,98,94,.14);--track:rgba(30,31,36,.09)}:root[data-blinko-theme="dark"]{color-scheme:dark;--bg:rgba(26,27,32,.96);--surface:#24252b;--text:#f4f4f5;--desc:#92949d;--line:rgba(255,255,255,.09);--accent:#ff746e;--accent-soft:rgba(255,116,110,.15);--track:rgba(255,255,255,.09)}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--text);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif}button,input{color:inherit;font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.card{position:relative;display:flex;width:100%;height:100%;min-height:0;flex-direction:column;padding:calc(var(--blinko-window-titlebar-height,44px) + 8px) 15px 15px;background:var(--bg);backdrop-filter:blur(22px) saturate(150%)}.top-controls{position:relative;z-index:6;display:grid;min-width:0;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}.content-actions{display:flex;justify-content:flex-end;gap:5px}.icon svg{width:17px}.icon{position:relative;display:grid;width:29px;height:29px;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--desc)}.icon:hover,.icon.active{background:var(--surface);color:var(--text)}.modes{display:grid;min-width:0;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;border-radius:12px;background:var(--surface)}.mode{min-width:0;height:31px;padding:0 5px;overflow:hidden;border:0;border-radius:9px;background:transparent;color:var(--desc);font-size:10px;font-weight:680;text-overflow:ellipsis;white-space:nowrap}.mode.active{background:var(--bg);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}.timer{position:relative;display:grid;width:min(188px,48vh);height:min(188px,48vh);min-width:142px;min-height:142px;margin:14px auto 8px;place-items:center}.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.track,.progress{fill:none;stroke-width:7}.track{stroke:var(--track)}.progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .35s linear}.time{font-size:clamp(34px,12vw,43px);font-variant-numeric:tabular-nums;font-weight:730;letter-spacing:-.055em}.session{max-width:160px;margin:4px auto 0;overflow:hidden;color:var(--desc);font-size:10px;font-weight:650;text-align:center;text-overflow:ellipsis;white-space:nowrap}.controls{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;margin-top:auto}.control{display:grid;height:42px;place-items:center;border:0;border-radius:13px;background:var(--surface);font-size:17px}.control:hover{filter:brightness(.97)}.control.primary{background:var(--accent);color:#fff;font-size:13px;font-weight:720}.hint{height:18px;margin-top:8px;color:var(--desc);font-size:9px;text-align:center}.settings{position:absolute;inset:calc(var(--blinko-window-titlebar-height,44px) + 7px) 12px 12px;z-index:7;display:none;min-height:0;flex-direction:column;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 16px 50px rgba(0,0,0,.16);backdrop-filter:blur(24px)}.settings.open{display:flex}.settings-head{display:flex;align-items:center;justify-content:space-between}.settings-title{font-size:14px;font-weight:730}.settings-copy{margin:5px 0 13px;color:var(--desc);font-size:10px;line-height:1.5}.form{display:grid;grid-template-columns:minmax(0,1fr) 68px 34px;gap:6px}.field{width:100%;height:36px;min-width:0;border:0;border-radius:10px;background:var(--surface);padding:0 10px;font-size:11px}.add{display:grid;height:36px;place-items:center;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:18px}.save-status{min-height:16px;margin-top:6px;color:var(--desc);font-size:9px}.save-status.error{color:var(--accent)}.presets{min-height:0;margin-top:4px;overflow:auto}.empty{padding:18px 4px;color:var(--desc);font-size:11px;text-align:center}.preset{display:flex;width:100%;align-items:center;gap:8px;padding:8px 2px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}.preset:first-child{border-top:0}.preset-main{min-width:0;flex:1}.preset-name{display:block;overflow:hidden;font-size:11px;font-weight:680;text-overflow:ellipsis;white-space:nowrap}.preset-time{display:block;margin-top:2px;color:var(--desc);font-size:9px}.remove{display:grid;width:28px;height:28px;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--desc)}.remove:hover{background:var(--surface);color:var(--accent)}@media(max-height:390px){.timer{width:142px;height:142px;margin-top:8px}.hint{display:none}.controls{margin-top:4px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="card">
    <div class="top-controls">
      <nav class="modes" aria-label="Timer mode"><button class="mode active" data-mode="focus" type="button">专注</button><button class="mode" data-mode="short" type="button">短休息</button><button class="mode" data-mode="long" type="button">长休息</button></nav>
      <div class="content-actions">
        <button class="icon" id="soundButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path id="soundWave" d="M16 9c1 1 1 5 0 6M19 6c3 3 3 9 0 12" stroke-linecap="round"/></svg></button>
        <button class="icon" id="settingsButton" type="button" aria-controls="settingsPanel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h5M15 7h5M4 12h10M20 12h0M4 17h3M13 17h7"/><circle cx="12" cy="7" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div class="timer"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88"/><circle class="progress" id="progress" cx="100" cy="100" r="88" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div><div class="time" id="time">25:00</div><div class="session" id="session">今天第 1 次专注</div></div></div>
    <div class="controls"><button class="control" id="resetButton" type="button">↺</button><button class="control primary" id="startButton" type="button">开始</button><button class="control" id="skipButton" type="button">↦</button></div>
    <div class="hint" id="hint">空格键开始或暂停</div>
    <section class="settings" id="settingsPanel">
      <div class="settings-head"><span class="settings-title" id="settingsTitle">自定义预设</span><button class="icon" id="settingsCloseButton" type="button">×</button></div>
      <p class="settings-copy" id="settingsCopy"></p>
      <div class="form" id="presetFields"><input class="field" id="presetName" maxlength="24" autocomplete="off"><input class="field" id="presetMinutes" type="number" min="1" max="180" inputmode="numeric"><button class="add" id="presetAddButton" type="button" aria-label="Add">+</button></div>
      <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>
      <div class="presets" id="presetList"></div>
    </section>
  </section>
  <script>
    (()=>{
      const bridge=window.blinkoCustomUi;
      const locale=document.documentElement.dataset.blinkoLocale||document.documentElement.lang||"en";
      const messages={
        en:{title:"Pomodoro",focus:"Focus",short:"Short break",long:"Long break",start:"Start",pause:"Pause",hint:"Space to start or pause",session:n=>`Focus session ${n} today`,settings:"Custom presets",settingsCopy:"Save a named countdown and apply it immediately.",name:"Preset name",minutes:"Minutes",empty:"No custom presets yet",soundOn:"Sound on",soundOff:"Muted",minimize:"Minimize",close:"Close",remove:"Delete",custom:"Custom",saving:"Saving…",saved:"Saved",saveFailed:"Could not save. Check the App connection and try again.",invalidPreset:"Enter a name and 1–180 minutes."},
        "zh-CN":{title:"番茄时钟",focus:"专注",short:"短休息",long:"长休息",start:"开始",pause:"暂停",hint:"空格键开始或暂停",session:n=>`今天第 ${n} 次专注`,settings:"自定义预设",settingsCopy:"保存后立即应用这个倒计时。",name:"预设名称",minutes:"分钟",empty:"还没有自定义预设",soundOn:"提示音已开启",soundOff:"已静音",minimize:"最小化",close:"关闭",remove:"删除",custom:"自定义",saving:"正在保存…",saved:"已保存",saveFailed:"保存失败，请检查 App 连接后重试。",invalidPreset:"请输入名称和 1–180 分钟。"},
        "zh-TW":{title:"番茄時鐘",focus:"專注",short:"短休息",long:"長休息",start:"開始",pause:"暫停",hint:"空白鍵開始或暫停",session:n=>`今天第 ${n} 次專注`,settings:"自訂預設",settingsCopy:"儲存後立即套用這個倒數。",name:"預設名稱",minutes:"分鐘",empty:"尚無自訂預設",soundOn:"提示音已開啟",soundOff:"已靜音",minimize:"最小化",close:"關閉",remove:"刪除",custom:"自訂",saving:"正在儲存…",saved:"已儲存",saveFailed:"儲存失敗，請檢查 App 連線後重試。",invalidPreset:"請輸入名稱和 1–180 分鐘。"}
      };
      Object.assign(messages.en,{completeTitle:"Timer complete",focusComplete:"Your focus session is complete.",breakComplete:"Your break is complete.",customComplete:"Your countdown is complete."});
      Object.assign(messages["zh-CN"],{completeTitle:"计时结束",focusComplete:"本次专注已完成。",breakComplete:"休息结束，可以继续专注了。",customComplete:"倒计时已结束。"});
      Object.assign(messages["zh-TW"],{completeTitle:"計時結束",focusComplete:"本次專注已完成。",breakComplete:"休息結束，可以繼續專注了。",customComplete:"倒數已結束。"});
      const t=messages[locale]||(locale.startsWith("zh")?messages["zh-CN"]:messages.en);
      const durations={focus:25*60,short:5*60,long:15*60};
      const $=id=>document.getElementById(id),time=$("time"),progress=$("progress"),session=$("session"),start=$("startButton"),sound=$("soundButton"),settingsButton=$("settingsButton"),settings=$("settingsPanel"),presetList=$("presetList"),saveStatus=$("saveStatus");
      let mode="focus",remaining=durations.focus,total=durations.focus,running=false,interval=null,focuses=1,lastTick=0,currentPresetId=null,muted=false,presets=[],audioContext=null,statusTimer=null;
      $("hint").textContent=t.hint;$("settingsTitle").textContent=t.settings;$("settingsCopy").textContent=t.settingsCopy;$("presetName").placeholder=t.name;$("presetMinutes").placeholder=t.minutes;
      document.querySelector('[data-mode="focus"]').textContent=t.focus;document.querySelector('[data-mode="short"]').textContent=t.short;document.querySelector('[data-mode="long"]').textContent=t.long;
      settingsButton.ariaLabel=t.settings;$("settingsCloseButton").ariaLabel=t.close;$("resetButton").ariaLabel="Reset";$("skipButton").ariaLabel="Skip";
      const activePreset=()=>presets.find(item=>item.id===currentPresetId);
      const showStatus=(message,error=false,clear=true)=>{if(statusTimer!==null)clearTimeout(statusTimer);saveStatus.textContent=message;saveStatus.classList.toggle("error",error);statusTimer=clear?setTimeout(()=>{saveStatus.textContent="";saveStatus.classList.remove("error");statusTimer=null},2400):null};
      const persistTimer=()=>bridge.storage.set("timer",{mode,remaining,total,focuses,currentPresetId}).catch(()=>false);
      const persistSettings=async(feedback=false)=>{if(feedback)showStatus(t.saving,false,false);try{await bridge.storage.set("settings",{muted,presets});if(feedback)showStatus(t.saved);return true}catch{if(feedback)showStatus(t.saveFailed,true,false);return false}};
      const persist=()=>Promise.all([persistTimer(),persistSettings()]);
      const setSettingsOpen=open=>{settings.classList.toggle("open",open);settingsButton.classList.toggle("active",open);settingsButton.ariaExpanded=String(open);if(open)queueMicrotask(()=>$("presetName").focus())};
      const draw=()=>{const safeTotal=Math.max(1,total);const min=Math.floor(remaining/60),sec=remaining%60;time.textContent=`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;progress.style.strokeDashoffset=String(100-(remaining/safeTotal)*100);session.textContent=mode==="focus"?t.session(focuses):mode==="short"?t.short:mode==="long"?t.long:(activePreset()?.name||t.custom);start.textContent=running?t.pause:t.start;document.querySelectorAll(".mode").forEach(node=>node.classList.toggle("active",node.dataset.mode===mode));sound.classList.toggle("active",muted);sound.ariaLabel=muted?t.soundOff:t.soundOn;$("soundWave").style.display=muted?"none":"";bridge.state(running,`${t.title} · ${time.textContent}`);};
      const stop=(save=true)=>{if(interval!==null)clearInterval(interval);interval=null;running=false;draw();if(save)persist();};
      const choose=(next,seconds=durations[next],presetId=null)=>{stop(false);mode=next;total=Math.max(60,Math.round(seconds));remaining=total;currentPresetId=presetId;draw();persist();};
      const prepareAudio=()=>{if(muted)return null;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();return audioContext}catch{return null}};
      const playChime=()=>{const context=prepareAudio();if(!context)return;const now=context.currentTime;[0,0.16,0.34].forEach((delay,index)=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type="sine";oscillator.frequency.value=[523.25,659.25,783.99][index];gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.11,now+delay+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.42);oscillator.connect(gain).connect(context.destination);oscillator.start(now+delay);oscillator.stop(now+delay+.45)});};
      const complete=(notify=true)=>{stop(false);if(notify){playChime();const body=mode==="focus"?t.focusComplete:mode==="short"||mode==="long"?t.breakComplete:t.customComplete;void bridge.notifications.show({title:t.completeTitle,body}).catch(()=>false)}if(mode==="focus"){focuses+=1;choose(focuses%4===0?"long":"short");}else if(mode==="short"||mode==="long")choose("focus");else choose("custom",total,currentPresetId);};
      const tick=()=>{const now=Date.now();const elapsed=Math.max(1,Math.round((now-lastTick)/1000));lastTick=now;remaining=Math.max(0,remaining-elapsed);draw();if(remaining===0)complete(true);};
      const toggle=()=>{if(running){stop();return;}prepareAudio();running=true;lastTick=Date.now();interval=setInterval(tick,1000);draw();};
      const renderPresets=()=>{presetList.replaceChildren();if(!presets.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=t.empty;presetList.append(empty);return}presets.forEach(item=>{const row=document.createElement("button");row.type="button";row.className="preset";row.innerHTML='<span class="preset-main"><span class="preset-name"></span><span class="preset-time"></span></span><span class="remove">×</span>';row.querySelector(".preset-name").textContent=item.name;row.querySelector(".preset-time").textContent=`${item.minutes} ${t.minutes.toLowerCase()}`;row.onclick=async event=>{if(event.target.closest(".remove")){presets=presets.filter(candidate=>candidate.id!==item.id);if(currentPresetId===item.id)choose("focus");renderPresets();await persistSettings(true);return}choose("custom",item.minutes*60,item.id);setSettingsOpen(false)};row.querySelector(".remove").ariaLabel=`${t.remove} ${item.name}`;presetList.append(row)})};
      document.querySelectorAll(".mode").forEach(node=>node.onclick=()=>choose(node.dataset.mode));start.onclick=toggle;$("resetButton").onclick=()=>choose(mode,total,currentPresetId);$("skipButton").onclick=()=>complete(false);
      sound.onclick=()=>{muted=!muted;if(!muted)prepareAudio();draw();void persistSettings()};settingsButton.onclick=event=>{event.stopPropagation();setSettingsOpen(!settings.classList.contains("open"))};$("settingsCloseButton").onclick=()=>setSettingsOpen(false);
      const addPreset=()=>{const name=$("presetName").value.trim(),minutes=Math.round(Number($("presetMinutes").value));if(!name||!Number.isFinite(minutes)||minutes<1||minutes>180){showStatus(t.invalidPreset,true);return}const preset={id:`preset_${Date.now().toString(36)}`,name,minutes};presets.push(preset);$("presetName").value="";$("presetMinutes").value="";renderPresets();choose("custom",minutes*60,preset.id);setSettingsOpen(false)};
      $("presetAddButton").onclick=addPreset;["presetName","presetMinutes"].forEach(id=>$(id).onkeydown=event=>{if(event.key==="Enter"){event.preventDefault();addPreset()}});
      addEventListener("keydown",event=>{if(event.code==="Space"&&!/INPUT|TEXTAREA/.test(event.target.tagName)){event.preventDefault();toggle()}if(event.code==="Escape")setSettingsOpen(false)});
      Promise.all([bridge.storage.get("timer"),bridge.storage.get("settings")]).then(([timerState,settingsState])=>{if(settingsState){muted=!!settingsState.muted;if(Array.isArray(settingsState.presets))presets=settingsState.presets.filter(item=>item&&typeof item.id==="string"&&typeof item.name==="string"&&Number.isFinite(item.minutes)&&item.minutes>=1&&item.minutes<=180).slice(0,30)}if(timerState&&["focus","short","long","custom"].includes(timerState.mode)&&Number.isFinite(timerState.remaining)&&Number.isFinite(timerState.total)&&Number.isFinite(timerState.focuses)){mode=timerState.mode;total=Math.max(60,Math.round(timerState.total));remaining=Math.max(1,Math.min(total,Math.round(timerState.remaining)));focuses=Math.max(1,Math.round(timerState.focuses));currentPresetId=typeof timerState.currentPresetId==="string"?timerState.currentPresetId:null}renderPresets();draw()}).catch(()=>{renderPresets();draw();showStatus(t.saveFailed,true,false)});
    })();
  </script>
</body>
</html>
